# ---------------------------------------------------------------------------
# Unique SQL Transpiler — Docker Compose
#
# The default `unique` service pulls the prebuilt image from Docker Hub, so an
# end user can run the API + web UI without building anything:
#
#     docker compose up -d        # then open http://localhost:8000/
#
# Pin a specific build by setting UNIQUE_TAG (e.g. a CI short SHA):
#
#     UNIQUE_TAG=abc1234 docker compose up -d
#
# Contributors who want to build from source instead can use the `dev`
# profile (hot-reload, local Dockerfile.dev):
#
#     docker compose --profile dev up
# ---------------------------------------------------------------------------

services:
  unique:
    image: jesusdf/unique:${UNIQUE_TAG:-latest}
    container_name: unique
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      # Set to 1/true to allow database connections (db-url) for resolving
      # metadata-dependent constructs (e.g. Oracle %TYPE/%ROWTYPE).
      # Off by default: connecting to a live database is a privileged action.
      # The web UI shows the "Database connection" field only when this is on
      # AND there is something usable: a named DSN (UNIQUE_DSN_<NAME>, add
      # yours below) for the picker, and/or UNIQUE_ALLOW_RAW_DB_URL=1 for the
      # structured host/port/user builder (single-user labs only).
      - UNIQUE_ALLOW_DB_CONNECTION=${UNIQUE_ALLOW_DB_CONNECTION:-0}
      - UNIQUE_ALLOW_RAW_DB_URL=${UNIQUE_ALLOW_RAW_DB_URL:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Development service: builds from source with hot-reload and test deps.
  # Enabled only via the `dev` profile so it never runs by default.
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: unique-dev
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - LOG_LEVEL=debug
      - UNIQUE_ALLOW_DB_CONNECTION=${UNIQUE_ALLOW_DB_CONNECTION:-0}
      - UNIQUE_ALLOW_RAW_DB_URL=${UNIQUE_ALLOW_RAW_DB_URL:-0}
    profiles:
      - dev
    command: ["uvicorn", "unique.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
