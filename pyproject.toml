[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unique"
version = "0.6.0"
description = "A SQL transpiler that translates SQL scripts between SQL Server, Oracle, PostgreSQL, and MySQL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Jesús Diéguez Fernández"},
]
dependencies = [
    "sqlglot==30.11.0",
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black==24.10.0",
    "isort==5.13.2",
    "ruff==0.15.17",
    "mypy==1.13.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
]
# Optional database drivers for metadata resolution (--db-url).
# Install only the driver(s) for the database(s) you need to connect to.
mssql = ["pyodbc>=5.0.0"]
oracle = ["oracledb>=2.0.0"]
postgresql = ["psycopg[binary]>=3.1.0"]
mysql = ["mysql-connector-python>=8.3.0"]
# Convenience group installing all database drivers at once.
db = [
    "pyodbc>=5.0.0",
    "oracledb>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "mysql-connector-python>=8.3.0",
]

[project.scripts]
unique = "unique.cli.main:cli"

[project.entry-points."unique.dialects"]
tsql = "unique.dialects.tsql:TSQLDialect"
oracle = "unique.dialects.oracle:OracleDialect"
postgresql = "unique.dialects.postgresql:PostgreSQLDialect"
mysql = "unique.dialects.mysql:MySQLDialect"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"unique.api" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/*.png",
    "static/*.ico",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["tests"]
markers = [
    "integration: tests that require a live external database (skipped by default)",
]
