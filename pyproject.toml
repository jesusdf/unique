[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unique"
# Single-sourced from src/unique/__init__.py (__version__); see
# [tool.setuptools.dynamic] below. Bump the version in exactly one place there.
dynamic = ["version"]
description = "A SQL transpiler that translates SQL scripts between SQL Server, Oracle, PostgreSQL, and MySQL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    {name = "Jesús Diéguez Fernández"},
]
dependencies = [
    "sqlglot==30.11.0",
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black==26.3.1",
    "isort==5.13.2",
    "ruff==0.15.17",
    "mypy==1.13.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    # Used by the functional-equivalence harness to load expected_state.yaml.
    "pyyaml>=6.0",
]
# Optional database drivers for metadata resolution (--db-url).
# Install only the driver(s) for the database(s) you need to connect to.
mssql = ["pyodbc>=5.0.0"]
oracle = ["oracledb>=2.0.0"]
postgresql = ["psycopg[binary]>=3.1.0"]
mysql = ["mysql-connector-python>=8.3.0"]
# pymssql bundles FreeTDS in its wheel, so it reaches SQL Server with no system
# ODBC driver — used by the functional-equivalence harness where the MS ODBC
# driver can't be installed (the harness prefers pyodbc when it is present).
mssql-freetds = ["pymssql>=2.3.0"]
# Convenience group installing all database drivers at once.
db = [
    "pyodbc>=5.0.0",
    "oracledb>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "mysql-connector-python>=8.3.0",
]

[project.scripts]
unique = "unique.cli.main:cli"

[project.entry-points."unique.dialects"]
tsql = "unique.dialects.tsql:TSQLDialect"
oracle = "unique.dialects.oracle:OracleDialect"
postgresql = "unique.dialects.postgresql:PostgreSQLDialect"
mysql = "unique.dialects.mysql:MySQLDialect"

[tool.setuptools.dynamic]
# The one place the version lives; setuptools reads it (by AST, no import) from
# ``__version__`` in src/unique/__init__.py.
version = {attr = "unique.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"unique.api" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/*.png",
    "static/*.ico",
]

[tool.black]
# Pin the exact formatter version. black changes its formatting between releases,
# so a mismatched local black would reformat files and then fail CI. With
# required-version, black instead errors out immediately with a clear message
# ("The required version `X` does not match the running version `Y`"), telling
# the developer to install the pinned version. Keep this in sync with the
# black== pin in [project.optional-dependencies].dev.
required-version = "26.3.1"
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C901", "PLR0912", "PLR0915"]

# Complexity ceilings (audit 2026-07-24 doc 04 F5 / 09-fix-briefs.md B17 T6).
# Set just at today's worst offender so the gate is green now but new code
# cannot exceed the worst legacy function; the giants are burned down under the
# architecture-ratchet gate (scripts/architecture_ratchets.py, C901 offenders),
# and these ceilings ratchet down with them.
[tool.ruff.lint.mccabe]
max-complexity = 355  # _emit_function (converter/emit.py)

[tool.ruff.lint.pylint]
max-branches = 348    # _emit_function
max-statements = 679  # _emit_function

[tool.ruff.lint.per-file-ignores]
# The converter package splits one module into _base/harvest/convert/emit and
# re-exports shared state/helpers via ``from ._base import *``; F403/F405 are the
# expected cost of that pattern (mypy still resolves the names via __all__).
"src/unique/core/converter/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

# live_validate imports OPTIONAL DB drivers inline, so their presence and
# typing vary per environment (CI's typecheck env lacks them entirely; a
# dev venv may have pymssql WITH stubs and pymysql without). Its inline
# ``# type: ignore`` comments are therefore needed in one env and unused
# in another — allow that, instead of failing whichever env disagrees.
[[tool.mypy.overrides]]
module = ["unique.core.live_validate", "unique.core.metadata"]
disable_error_code = ["unused-ignore"]

# The converter emitter split (audit doc 04 F4) moved the mutually-recursive
# emitter families into emit_functions/emit_expr/emit_ddl/emit_passthrough.
# Their bodies reference sibling emitters and emit.py helpers by bare name;
# those names are completed at import time by the namespace injection emit.py
# performs after loading every seam (so they exist at runtime and the suite
# proves it), but they are not statically importable without recreating the
# cycle. Disable only ``name-defined`` for these seams — every other strict
# check stays on, as it was when the code lived in emit.py. ``no-any-return``
# is disabled for the same reason: an injected sibling emitter is statically
# ``Any``, so returning its result trips warn_return_any even though the real
# (runtime) return type is ``str``.
[[tool.mypy.overrides]]
module = [
    "unique.core.converter.emit_functions",
    "unique.core.converter.emit_expr",
    "unique.core.converter.emit_ddl",
    "unique.core.converter.emit_passthrough",
]
disable_error_code = ["name-defined", "no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["tests"]
# Safety net: if any single test runs longer than this, dump every thread's
# traceback to stderr so a silent hang is diagnosable in the CI log instead of
# manifesting only as "the runner received a shutdown signal". Survives the
# parallel runner's ``-o addopts=""`` reset (that clears addopts, not this key).
faulthandler_timeout = 120
markers = [
    "integration: tests that require a live external database (skipped by default)",
]

[tool.coverage.run]
source = ["unique"]
# Combine data files written by the parallel test runner's per-worker processes.
relative_files = true
