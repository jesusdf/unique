name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Check imports (isort)
        run: isort --check-only src/ tests/

      - name: Lint (ruff)
        run: ruff check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/unique/ --ignore-missing-imports

  test:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Single version, matching the Docker image (python:3.13-slim).
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install GNU parallel
        run: sudo apt-get update && sudo apt-get install -y parallel

      - name: Run tests with coverage (parallel across cores)
        # Splits the suite at test granularity across CPUs (a single heavy file,
        # test_real_world.py, dominates a serial run). The runner uses nproc
        # workers (scripts/test-parallel.sh: N=${PYTEST_WORKERS:-$(nproc)}), so
        # coverage memory is tied to the core count — ~0.3 GB/worker, ~1.2 GB
        # total on a 4-core runner (measured 2026-07-22). The earlier OOM
        # ("runner received a shutdown signal") was NOT coverage accumulation but
        # one test's unbounded parser allocation (the psql-COPY guard regression,
        # fixed in 02f483b); COVERAGE_CORE=sysmon keeps instrumentation near-free.
        run: COV=1 PYTEST_PYTHON=python scripts/test-parallel.sh

      - name: Identity-mutation gate (test-assertion quality)
        # Fails if too few integration tests detect a no-op transpiler; see
        # audit/2026-07-02/02-test-quality.md and scripts/identity_mutation_check.py.
        run: python scripts/identity_mutation_check.py

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml

  metadata-live:
    name: Live Metadata Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unique
          POSTGRES_PASSWORD: unique
          POSTGRES_DB: unique
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U unique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: unique
          MYSQL_PASSWORD: unique
          MYSQL_DATABASE: unique
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uunique -punique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies and DB drivers
        run: pip install -e ".[dev]" "psycopg[binary]>=3.1.0" "mysql-connector-python>=8.3.0"

      - name: Seed schemas
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client default-mysql-client
          PGPASSWORD=unique psql -h localhost -p 5433 -U unique -d unique \
            -f tests/fixtures/sql/pg_schema.sql
          mysql -h 127.0.0.1 -P 3307 -uunique -punique unique \
            < tests/fixtures/sql/mysql_schema.sql

      - name: Run live metadata tests
        env:
          UNIQUE_TEST_PG_URL: postgresql://unique:unique@localhost:5433/unique
          UNIQUE_TEST_MYSQL_URL: mysql://unique:unique@localhost:3307/unique
        run: pytest tests/integration/test_metadata_live.py -v

  syntax-live:
    name: Live Syntax Validation
    # 22.04 ships the Microsoft ODBC Driver 18 (msodbcsql18) preinstalled,
    # avoiding a flaky apt install of the Microsoft repo on newer runners.
    runs-on: ubuntu-22.04
    # SQL Server, Oracle, MySQL and PostgreSQL are all validated here.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Unique_Strong!Pass1"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: UniqueStrongPass1
          MYSQL_DATABASE: unique
          MYSQL_USER: unique
          MYSQL_PASSWORD: unique
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uunique -punique"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unique
          POSTGRES_PASSWORD: unique
          POSTGRES_DB: unique
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U unique"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Start Oracle Free container
        run: |
          # Started as a plain container (not a service) so we can give it a
          # long, observable startup window and read its logs on failure.
          # APP_USER must not be an Oracle reserved word: the image's setup
          # runs an unquoted CREATE USER, which folds 'unique' to the
          # reserved UNIQUE (ORA-01935) and kills the entrypoint — found by
          # the engine-reachability gate, 2026-07-10.
          docker run -d --name oracle \
            -p 1521:1521 \
            -e ORACLE_PASSWORD=UniqueStrongPass1 \
            -e APP_USER=uniqueapp \
            -e APP_USER_PASSWORD=UniqueStrongPass1 \
            gvenzl/oracle-free:23-slim-faststart
          echo "Oracle container started; it will initialize while deps install."

      - name: Install dependencies and DB drivers
        run: |
          # pymssql (bundled FreeTDS) lets the functional-equivalence harness
          # reach SQL Server without the MS ODBC driver, so it is unaffected by a
          # flaky msodbcsql18 apt install; the syntax step still uses pyodbc.
          pip install -e ".[dev]" "psycopg[binary]>=3.1.0" \
            "mysql-connector-python>=8.3.0" "pyodbc>=5.1.0" "oracledb>=2.0.0" \
            "pymssql>=2.3.0"

      - name: Ensure Microsoft ODBC Driver 18
        run: |
          set -uxo pipefail
          # 22.04 runners usually ship the driver already.
          if odbcinst -q -d 2>/dev/null | grep -qi "ODBC Driver 18 for SQL Server"; then
            echo "ODBC Driver 18 already present."
            exit 0
          fi
          . /etc/os-release
          VER="${VERSION_ID}"
          if ! curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VER}/prod.list" -o /tmp/mssql.list; then
            VER="22.04"
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VER}/prod.list" -o /tmp/mssql.list || true
          fi
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg || true
          sudo sed -i 's#\[.*\]#[signed-by=/usr/share/keyrings/microsoft-prod.gpg]#' /tmp/mssql.list || true
          sudo cp /tmp/mssql.list /etc/apt/sources.list.d/mssql-release.list || true
          sudo apt-get update || true
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev || \
            echo "WARNING: msodbcsql18 install failed; the SQL Server checks will skip."

      - name: Wait for SQL Server
        continue-on-error: true
        run: |
          python - <<'PY'
          import time
          try:
              import pyodbc
          except Exception as e:
              print(f"pyodbc unavailable, skipping wait: {e}")
              raise SystemExit(0)
          dsn = (
              "DRIVER={ODBC Driver 18 for SQL Server};"
              "SERVER=localhost,1433;UID=sa;PWD=Unique_Strong!Pass1;"
              "TrustServerCertificate=yes;"
          )
          for attempt in range(40):
              try:
                  pyodbc.connect(dsn, timeout=3).close()
                  print("SQL Server ready")
                  break
              except Exception as e:
                  print(f"waiting... ({attempt}) {e}")
                  time.sleep(3)
          else:
              print("SQL Server not ready; its checks will skip.")
          PY

      - name: Wait for Oracle
        id: oracle_wait
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import time
          try:
              import oracledb
          except Exception as e:
              print(f"oracledb unavailable, skipping wait: {e}")
              raise SystemExit(0)
          ok = False
          for attempt in range(60):  # up to ~5 min
              try:
                  oracledb.connect(
                      user="uniqueapp",
                      password="UniqueStrongPass1",
                      dsn="localhost:1521/FREEPDB1",
                  ).close()
                  print("Oracle ready")
                  ok = True
                  break
              except Exception as e:
                  print(f"waiting... ({attempt}) {e}")
                  time.sleep(5)
          if not ok:
              print("Oracle not ready; its checks will skip.")
          # Publish readiness so the log-surfacing step below fires only on a
          # genuine startup failure (not on every healthy run).
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"ready={'true' if ok else 'false'}\n")
          PY

      - name: Oracle container logs (on startup failure)
        # Only surface the container logs — as an ::error:: annotation, readable
        # via the annotations API when the raw logs sit on a blocked blob — when
        # Oracle did NOT come up. On a healthy run this step is skipped, so success
        # no longer carries a spurious red 'failure' annotation (its SGA banner).
        if: always() && steps.oracle_wait.outputs.ready != 'true'
        run: |
          LOG="$(docker logs oracle 2>&1 | tail -25 || true)"
          ENC="${LOG//'%'/'%25'}"
          ENC="${ENC//$'\n'/'%0A'}"
          echo "::error title=oracle-logs (startup failed)::${ENC}"

      - name: Gate — all four engines must be reachable
        # The waits above are continue-on-error so their logs stay readable,
        # but a missing engine must FAIL the job, not silently shrink the
        # live validation to whatever happened to come up (audit P3).
        run: |
          python - <<'PY'
          import sys

          failures = []

          def check(name, fn):
              try:
                  fn()
                  print(f"{name} OK")
              except Exception as e:  # noqa: BLE001
                  failures.append(f"{name}: {e}")

          def pg():
              import psycopg

              psycopg.connect(
                  "postgresql://unique:unique@localhost:5433/unique",
                  connect_timeout=10,
              ).close()

          def my():
              import mysql.connector

              mysql.connector.connect(
                  host="127.0.0.1", port=3307, user="root",
                  password="UniqueStrongPass1", database="unique",
                  connection_timeout=10,
              ).close()

          def ora():
              import oracledb

              oracledb.connect(
                  user="uniqueapp", password="UniqueStrongPass1",
                  dsn="localhost:1521/FREEPDB1",
              ).close()

          def ms():
              import pymssql

              pymssql.connect(
                  server="127.0.0.1", port=1433, user="sa",
                  password="Unique_Strong!Pass1", database="master",
                  login_timeout=10,
              ).close()

          check("postgresql", pg)
          check("mysql", my)
          check("oracle", ora)
          check("mssql", ms)
          if failures:
              for f in failures:
                  print(f"::error title=engine unreachable::{f}")
              sys.exit(1)
          PY

      - name: Run live syntax validation
        env:
          # All four engines are validated here. oracle-free's default PDB is
          # FREEPDB1.
          UNIQUE_TEST_MSSQL_URL: mssql://sa:Unique_Strong!Pass1@localhost:1433/master
          UNIQUE_TEST_ORACLE_URL: oracle://uniqueapp:UniqueStrongPass1@localhost:1521/FREEPDB1
          UNIQUE_TEST_MYSQL_URL: mysql://root:UniqueStrongPass1@localhost:3307/unique
          UNIQUE_TEST_PG_URL: postgresql://unique:unique@localhost:5433/unique
        run: |
          # Run, capture output, and surface failures as ::error:: annotations
          # (readable via the annotations API; raw logs sit on a blocked blob).
          # TestOracleTypeResolutionAcrossEngines proves an Oracle %TYPE/%ROWTYPE
          # source resolves through a --db-url of every engine (it seeds its own
          # self-contained probe table, so it needs no pre-seeded schema).
          # test_corpus_live sweeps the SQL corpus (transpile -> execute on the
          # real engine) so invalid output that a permissive parser would accept
          # is still caught; documented gaps are annotated -- @xfail in the corpus.
          # test_corpus_results_live goes further: it compares the *result* of the
          # source vs the transpiled output, catching semantic (wrong-answer) bugs.
          set +e
          pytest tests/integration/test_live_syntax.py \
            "tests/integration/test_metadata_live.py::TestOracleTypeResolutionAcrossEngines" \
            tests/integration/test_corpus_live.py \
            tests/integration/test_corpus_results_live.py \
            -v -rA \
            > /tmp/pytest.out 2>&1
          rc=$?
          set -e
          cat /tmp/pytest.out
          {
            echo '```'
            cat /tmp/pytest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then
            # Extract the assertion/error lines and emit a compact annotation.
            DETAIL=$(grep -E "^(FAILED|E |assert|.*Engine error|.*--- sql ---|.*invalid SQL)" /tmp/pytest.out \
              | head -40 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Live syntax validation failed::${DETAIL}"
          fi
          exit $rc

      - name: Run functional-equivalence harness (4x4 matrix)
        # Gating: all 16 (source, target) pairs are confirmed live-green (the repo
        # holds only the four native fixtures; source != target is transpiled on
        # the fly and asserted against the engine-agnostic expected_state.yaml).
        # See tests/functional_equivalence/HARNESS.md and docs/DONE.md §16.
        env:
          # Reuses the same engines already started for this job. For every
          # (source, target) pair the harness runs the native fixture (source ==
          # target) or the on-the-fly transpiled one, and asserts each reaches
          # the engine-agnostic expected_state.yaml.
          UNIQUE_TEST_MSSQL_URL: mssql://sa:Unique_Strong!Pass1@localhost:1433/master
          UNIQUE_TEST_ORACLE_URL: oracle://uniqueapp:UniqueStrongPass1@localhost:1521/FREEPDB1
          UNIQUE_TEST_MYSQL_URL: mysql://root:UniqueStrongPass1@localhost:3307/unique
          UNIQUE_TEST_PG_URL: postgresql://unique:unique@localhost:5433/unique
        run: |
          set +e
          pytest tests/functional_equivalence/test_functional_equivalence_live.py -v -rA \
            > /tmp/fe.out 2>&1
          rc=$?
          set -e
          cat /tmp/fe.out
          {
            echo '### Functional-equivalence harness'
            echo '```'
            cat /tmp/fe.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then
            DETAIL=$(grep -E "^(FAILED|E |assert|.*diverged from)" /tmp/fe.out \
              | head -40 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Functional-equivalence harness failed::${DETAIL}"
          fi
          exit $rc

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    # Only build/publish the image on a version tag, and only after the full
    # quality gate — including the live syntax validation against the real
    # engines — has passed. This guarantees a published image was verified
    # end to end.
    needs: [lint, typecheck, test, metadata-live, syntax-live]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ github.repository_owner }}/unique:latest
            docker.io/${{ github.repository_owner }}/unique:${{ steps.vars.outputs.sha_short }}
            docker.io/${{ github.repository_owner }}/unique:${{ steps.vars.outputs.version }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository_owner }}/unique
          readme-filepath: ./README.md
