name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Check imports (isort)
        run: isort --check-only src/ tests/

      - name: Lint (ruff)
        run: ruff check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/unique/ --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=unique --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  metadata-live:
    name: Live Metadata Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unique
          POSTGRES_PASSWORD: unique
          POSTGRES_DB: unique
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U unique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: unique
          MYSQL_PASSWORD: unique
          MYSQL_DATABASE: unique
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uunique -punique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and DB drivers
        run: pip install -e ".[dev]" "psycopg[binary]>=3.1.0" "mysql-connector-python>=8.3.0"

      - name: Seed schemas
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client default-mysql-client
          PGPASSWORD=unique psql -h localhost -p 5433 -U unique -d unique \
            -f tests/fixtures/sql/pg_schema.sql
          mysql -h 127.0.0.1 -P 3307 -uunique -punique unique \
            < tests/fixtures/sql/mysql_schema.sql

      - name: Run live metadata tests
        env:
          UNIQUE_TEST_PG_URL: postgresql://unique:unique@localhost:5433/unique
          UNIQUE_TEST_MYSQL_URL: mysql://unique:unique@localhost:3307/unique
        run: pytest tests/integration/test_metadata_live.py -v

  syntax-live:
    name: Live Syntax Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unique
          POSTGRES_PASSWORD: unique
          POSTGRES_DB: unique
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U unique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: unique
          MYSQL_PASSWORD: unique
          MYSQL_DATABASE: unique
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uunique -punique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Unique_Strong!Pass1"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and DB drivers
        run: |
          pip install -e ".[dev]" "psycopg[binary]>=3.1.0" \
            "mysql-connector-python>=8.3.0" "pyodbc>=5.1.0"

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Wait for SQL Server
        run: |
          python - <<'PY'
          import time, pyodbc
          dsn = (
              "DRIVER={ODBC Driver 18 for SQL Server};"
              "SERVER=localhost,1433;UID=sa;PWD=Unique_Strong!Pass1;"
              "TrustServerCertificate=yes;"
          )
          for attempt in range(40):
              try:
                  pyodbc.connect(dsn, timeout=3).close()
                  print("SQL Server ready")
                  break
              except Exception as e:
                  print(f"waiting... ({attempt}) {e}")
                  time.sleep(3)
          else:
              raise SystemExit("SQL Server did not become ready")
          PY

      - name: Run live syntax validation
        env:
          UNIQUE_TEST_PG_URL: postgresql://unique:unique@localhost:5433/unique
          UNIQUE_TEST_MYSQL_URL: mysql://unique:unique@localhost:3307/unique
          UNIQUE_TEST_MSSQL_URL: mssql://sa:Unique_Strong!Pass1@localhost:1433/master
        run: pytest tests/integration/test_live_syntax.py -v

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ github.repository_owner }}/unique:latest
            docker.io/${{ github.repository_owner }}/unique:${{ steps.vars.outputs.sha_short }}
            ${{ steps.vars.outputs.version && format('docker.io/{0}/unique:{1}', github.repository_owner, steps.vars.outputs.version) || '' }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository_owner }}/unique
          readme-filepath: ./README.md
