name: Mutation testing (nightly)

# Mutation testing is slow (it re-runs the tests once per mutant), so it runs
# nightly and on demand rather than on every push. It measures test-assertion
# quality: the surviving mutants are lines a test executes but does not verify —
# what line coverage cannot see. Informational (does not gate merges); the score
# and survivors are written to the run summary.

on:
  schedule:
    - cron: "44 4 * * *"  # 04:44 UTC nightly
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write  # open a tracking issue when a module regresses below its floor

jobs:
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Mutate the DML converter
        run: |
          python scripts/mutation_test.py \
            src/unique/core/converter/convert.py \
            src/unique/core/converter/emit.py \
            src/unique/core/converter/_base.py \
            src/unique/core/converter/harvest.py \
            --tests tests/unit/core tests/integration/test_cross_dialect.py \
            | tee /tmp/mut_dml.txt || true

      - name: Mutate the procedural transformer
        run: |
          python scripts/mutation_test.py \
            src/unique/core/procedural/transformer/base.py \
            src/unique/core/procedural/transformer/oracle.py \
            --tests tests/unit/core/procedural tests/integration/test_procedural.py \
            | tee /tmp/mut_proc.txt || true

      - name: Publish scores + survivors to the summary
        if: always()
        run: |
          {
            echo '## Mutation testing (survivors = un-asserted lines to review)'
            echo '### DML converter'
            echo '```'
            grep -E '=== src|score |TOTAL survivors' /tmp/mut_dml.txt || true
            echo '```'
            echo '<details><summary>DML survivors</summary>'
            echo '```'
            sed -n '/=== SURVIVORS/,$p' /tmp/mut_dml.txt || true
            echo '```'
            echo '</details>'
            echo '### Procedural transformer'
            echo '```'
            grep -E '=== src|score |TOTAL survivors' /tmp/mut_proc.txt || true
            echo '```'
            echo '<details><summary>Procedural survivors</summary>'
            echo '```'
            sed -n '/=== SURVIVORS/,$p' /tmp/mut_proc.txt || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check mutation floors
        # Fails (red job) on a real regression: a module's score dropped below its
        # floor, or the harness produced no scores (a crash). Normal survivors do
        # not fail it — the mutation steps above swallow their non-zero exit.
        run: |
          python - <<'PY'
          import re, sys
          FLOORS = {
              "convert.py": 65, "emit.py": 60, "_base.py": 38,
              "harvest.py": 48, "base.py": 52,  # transformer/base.py
          }
          scores, current = {}, None
          for path in ("/tmp/mut_dml.txt", "/tmp/mut_proc.txt"):
              try:
                  lines = open(path).read().splitlines()
              except FileNotFoundError:
                  continue
              for line in lines:
                  m = re.search(r"=== \S+/([\w.]+\.py)\s+\(\d+ mutants\)", line)
                  if m:
                      current = m.group(1)
                      continue
                  m = re.search(r"score \d+/\d+ killed \((\d+)%\)", line)
                  if m and current:
                      scores[current] = int(m.group(1))
                      current = None
          if not scores:
              print("::error::mutation produced no scores (harness crash?)")
              sys.exit(1)
          problems = [
              f"{n}: {p}% < floor {FLOORS[n]}%"
              for n, p in scores.items() if n in FLOORS and p < FLOORS[n]
          ]
          print("measured:", scores)
          if problems:
              print("::error::mutation-score regression: " + "; ".join(problems))
              sys.exit(1)
          print("all measured modules at/above floor")
          PY

      - name: Open an issue on regression
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Nightly mutation regression"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Avoid spam: only open one if there is no open issue already.
          existing=$(gh issue list --state open --search "in:title $title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title ($(date -u +%F))" --body \
              "The nightly mutation job failed: a module's test-assertion score dropped below its floor, or the harness errored. Review the surviving mutants and add assertions (or fix the harness). Run: $run_url"
          else
            echo "an open '$title' issue already exists — not duplicating."
          fi
