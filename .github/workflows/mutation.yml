name: Mutation testing (weekly)

# Mutation testing is slow (it re-runs the tests once per mutant), so it runs
# weekly and on demand rather than on every push. It measures test-assertion
# quality: the surviving mutants are lines a test executes but does not verify —
# what line coverage cannot see. Informational (does not gate merges); the score
# and survivors are written to the run summary.

on:
  schedule:
    - cron: "44 4 * * 5"  # Fridays 04:44 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write  # open a tracking issue when a module regresses below its floor

jobs:
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Mutate the DML converter
        run: |
          python scripts/mutation_test.py \
            src/unique/core/converter/convert.py \
            src/unique/core/converter/emit.py \
            src/unique/core/converter/emit_functions.py \
            src/unique/core/converter/emit_expr.py \
            src/unique/core/converter/emit_ddl.py \
            src/unique/core/converter/emit_passthrough.py \
            src/unique/core/converter/_base.py \
            src/unique/core/converter/harvest.py \
            --tests tests/unit/core tests/integration/test_cross_dialect.py \
                    tests/integration/test_pg_source_wave1.py \
                    tests/integration/test_challenge_assertions_sqlserver.py \
                    tests/integration/test_challenge_assertions_oracle.py \
                    tests/integration/test_challenge_assertions_postgresql.py \
                    tests/integration/test_challenge_assertions_mysql.py \
            | tee /tmp/mut_dml.txt || true

      - name: Mutate the procedural transformer
        run: |
          python scripts/mutation_test.py \
            src/unique/core/procedural/transformer/base.py \
            src/unique/core/procedural/transformer/oracle.py \
            --tests tests/unit/core/procedural tests/integration/test_procedural.py \
                    tests/integration/test_pg_source_wave1.py \
                    tests/integration/test_cursor_state_b7.py \
                    tests/unit/core/procedural/test_dynamic_sql_constant.py \
            | tee /tmp/mut_proc.txt || true

      - name: Publish scores + survivors to the summary
        if: always()
        run: |
          {
            echo '## Mutation testing (survivors = un-asserted lines to review)'
            echo '### DML converter'
            echo '```'
            grep -E '=== src|score |TOTAL survivors' /tmp/mut_dml.txt || true
            echo '```'
            echo '<details><summary>DML survivors</summary>'
            echo '```'
            sed -n '/=== SURVIVORS/,$p' /tmp/mut_dml.txt || true
            echo '```'
            echo '</details>'
            echo '### Procedural transformer'
            echo '```'
            grep -E '=== src|score |TOTAL survivors' /tmp/mut_proc.txt || true
            echo '```'
            echo '<details><summary>Procedural survivors</summary>'
            echo '```'
            sed -n '/=== SURVIVORS/,$p' /tmp/mut_proc.txt || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check mutation floors
        # Fails (red job) on a real regression: a module's score dropped below its
        # floor, or the harness produced no scores (a crash). Normal survivors do
        # not fail it — the mutation steps above swallow their non-zero exit.
        run: |
          python - <<'PY'
          import re, sys
          # Floors last reviewed 2026-07-25 (audit B15): a local full-prefix
          # measurement of convert.py (n=300, PRE-expanded selections) scored
          # 66% -- floors kept, because the expanded --tests selections above
          # (the four challenge assertion modules, +1,073 identity-killing
          # tests) will raise every measured score. The STALE check below
          # forces the bump after the first scheduled run at this HEAD.
          FLOORS = {
              "convert.py": 65, "emit.py": 60, "_base.py": 38,
              "harvest.py": 48, "base.py": 52,  # transformer/base.py
          }
          STALE_MARGIN = 15  # measured - floor > this => floor must be raised
          scores, current = {}, None
          for path in ("/tmp/mut_dml.txt", "/tmp/mut_proc.txt"):
              try:
                  lines = open(path).read().splitlines()
              except FileNotFoundError:
                  continue
              for line in lines:
                  m = re.search(r"=== \S+/([\w.]+\.py)\s+\(\d+ mutants\)", line)
                  if m:
                      current = m.group(1)
                      continue
                  m = re.search(r"score \d+/\d+ killed \((\d+)%\)", line)
                  if m and current:
                      scores[current] = int(m.group(1))
                      current = None
          if not scores:
              print("::error::mutation produced no scores (harness crash?)")
              sys.exit(1)
          problems = [
              f"{n}: {p}% < floor {FLOORS[n]}%"
              for n, p in scores.items() if n in FLOORS and p < FLOORS[n]
          ]
          # Self-ratcheting (audit B15/T7): a floor left >STALE_MARGIN under
          # the measurement is head-room that absorbs regressions -- the
          # scheduled run itself demands the raise instead of an audit.
          stale = [
              f"{n}: measured {p}% vs floor {FLOORS[n]}% -- raise to {p - 10}%"
              for n, p in scores.items()
              if n in FLOORS and p - FLOORS[n] > STALE_MARGIN
          ]
          unfloored = sorted(n for n in scores if n not in FLOORS)
          print("measured:", scores)
          if unfloored:
              print("::warning::modules measured but not floored -- set floors "
                    "from this run: " + ", ".join(unfloored))
          if problems:
              print("::error::mutation-score regression: " + "; ".join(problems))
              sys.exit(1)
          if stale:
              print("::error::stale mutation floors -- raise them: "
                    + "; ".join(stale))
              sys.exit(1)
          print("all measured modules at/above floor and within the stale margin")
          PY

      - name: Open an issue on regression
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Weekly mutation regression"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Avoid spam: only open one if there is no open issue already.
          existing=$(gh issue list --state open --search "in:title $title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title ($(date -u +%F))" --body \
              "The weekly mutation job failed: a module's test-assertion score dropped below its floor, or the harness errored. Review the surviving mutants and add assertions (or fix the harness). Run: $run_url"
          else
            echo "an open '$title' issue already exists — not duplicating."
          fi
