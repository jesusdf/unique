<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Unique logo">
  <title>Unique</title>
  <!--
    Wordmark glyph: a capital "U" in red. Sans-serif with flat tops, thick
    vertical stems, and a bowl that thins markedly at the bottom, giving a
    strong thick/thin contrast. Single filled path, so it scales crisply at any
    size and needs no font to be installed.
  -->
  <path fill="#C9252C" d="
    M 15 13
    L 15 58
    C 15 79 31 89 50 89
    C 69 89 85 79 85 58
    L 85 13
    L 68 13
    L 68 58
    C 68 75 60 84 50 84
    C 40 84 32 75 32 58
    L 32 13
    Z
  "/>
</svg>
