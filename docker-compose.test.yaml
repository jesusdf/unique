# ---------------------------------------------------------------------------
# Unique — database services for live metadata-resolution tests
# ---------------------------------------------------------------------------
# These databases back the optional `--db-url` metadata resolver tests.
# Start them with:
#     docker compose -f docker-compose.test.yaml up -d
# then run:
#     UNIQUE_TEST_PG_URL=postgresql://unique:unique@localhost:5433/unique \
#     UNIQUE_TEST_MYSQL_URL=mysql://unique:unique@localhost:3307/unique \
#     pytest tests/integration/test_metadata_live.py
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unique
      POSTGRES_PASSWORD: unique
      POSTGRES_DB: unique
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unique"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./tests/fixtures/sql/pg_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  mysql:
    image: mysql:8
    # Binary logging is on by default in MySQL 8, which blocks a non-SUPER user
    # (here `unique`) from creating stored routines/triggers unless the server
    # trusts function creators (error 1419). The live-syntax tests create
    # triggers/procedures, so enable that trust for the throwaway test stack.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: unique
      MYSQL_PASSWORD: unique
      MYSQL_DATABASE: unique
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uunique", "-punique"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./tests/fixtures/sql/mysql_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  # SQL Server is used to syntax-validate transpiled T-SQL output (SET NOEXEC
  # ON parses without executing), catching dialect violations like
  # CREATE TABLE IF NOT EXISTS or stray ';' before GO.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Unique_Strong!Pass1"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"Unique_Strong!Pass1\" -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"Unique_Strong!Pass1\" -Q \"SELECT 1\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  # Oracle Free, used by the functional-equivalence harness to run the
  # transpiled scenario and read its final state. Connect with:
  #   UNIQUE_TEST_ORACLE_URL=oracle://system:oracle@localhost:1521/FREEPDB1
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: oracle
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
